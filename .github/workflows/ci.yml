name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  base-install:
    # No extras and the pinned plotting stack: the analysis must reproduce every committed output byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/reproduce.txt
      - run: python -m pip install -c constraints/reproduce.txt . pytest
      - run: hallumat --version
      - name: Reproduce into a fresh directory
        run: hallumat reproduce --out "$RUNNER_TEMP/reproduce" > "$RUNNER_TEMP/stdout.txt"
      - name: The report and the metrics match the committed ones byte for byte
        run: |
          diff tests/golden/reproduce_stdout.txt "$RUNNER_TEMP/stdout.txt"
          cmp results/agreement_metrics.csv "$RUNNER_TEMP/reproduce/agreement_metrics.csv"
      - name: The figures match the committed ones byte for byte
        run: cd "$RUNNER_TEMP/reproduce" && sha256sum --check "$GITHUB_WORKSPACE/tests/golden/figures.sha256"
      - run: pytest tests/unit/test_import_hygiene.py tests/integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel holds only the package; data/ and results/ never ship
        shell: python
        run: |
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          [wheel] = Path("dist").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          stray = [n for n in names if not n.startswith(("hallumat/", f"hallumat-{version}.dist-info/"))]
          assert not stray, f"unexpected wheel members: {stray}"
          assert "hallumat/py.typed" in names
          [sdist] = Path("dist").glob("*.tar.gz")
          tops = {m.name.split("/")[1] for m in tarfile.open(sdist) if m.name.count("/")}
          assert not tops & {"data", "results"}, f"the sdist ships {sorted(tops & {'data', 'results'})}"
          print(f"{wheel.name}: {len(names)} members; {sdist.name}: {sorted(tops)}")
